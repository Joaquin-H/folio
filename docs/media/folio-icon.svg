<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Sombra suave exterior -->
    <filter id="folio-shadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#140b03" flood-opacity="0.26" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.14" />
    </filter>

    <filter id="folio-band-shadow" x="-30%" y="-10%" width="160%" height="120%">
      <feDropShadow dx="-3" dy="2" stdDeviation="4" flood-color="#140b03" flood-opacity="0.25" />
    </filter>

    <!-- Tapa de cuero caramelo cálido -->
    <linearGradient id="folio-cover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#be8754" />
      <stop offset="45%" stop-color="#aa713e" />
      <stop offset="100%" stop-color="#8a5323" />
    </linearGradient>

    <!-- Bisel de luz superior suave -->
    <linearGradient id="folio-rim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.35" />
    </linearGradient>

    <!-- Banda elástica en terracota vivo satinado (alto contraste) -->
    <linearGradient id="folio-band" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc5b4b" />
      <stop offset="45%" stop-color="#e86b5b" />
      <stop offset="100%" stop-color="#be3f30" />
    </linearGradient>

    <!-- Lomo en curvatura suave -->
    <linearGradient id="folio-spine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#000000" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <g filter="url(#folio-shadow)">
    <!-- Bloque de hojas interiores de papel (marfil) -->
    <rect x="122" y="74" width="300" height="364" rx="30" fill="#faf6ed" />
    <line x1="416" y1="104" x2="416" y2="408" stroke="#dcd3bf" stroke-width="2" opacity="0.6" stroke-dasharray="1 3" />

    <!-- Tapa delantera de cuero caramelo cálido -->
    <rect x="104" y="66" width="308" height="380" rx="32" fill="url(#folio-cover)" />
    <rect x="105" y="67" width="306" height="378" rx="31" fill="none" stroke="url(#folio-rim)" stroke-width="1.5" />

    <!-- Lomo izquierdo con luz natural -->
    <path d="M 104 98 C 104 80, 118 66, 136 66 L 150 66 L 150 446 L 136 446 C 118 446, 104 432, 104 414 Z" fill="url(#folio-spine)" />

    <!-- Banda elástica vertical terracota vivo sobre el cuero caramelo -->
    <g filter="url(#folio-band-shadow)">
      <rect x="340" y="62" width="34" height="388" rx="8" fill="url(#folio-band)" />
      <line x1="344" y1="64" x2="344" y2="448" stroke="#ffffff" stroke-width="1.2" opacity="0.3" />
    </g>
  </g>
</svg>
